<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Information - NeuroEase</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style_bq.css') }}">
    <script>
        function toggleMedicalCondition() {
            var yesRadio = document.getElementById("medical_yes");
            var conditionInput = document.getElementById("medical_condition_input");
            conditionInput.style.display = yesRadio.checked ? "block" : "none";
        }
    </script>
</head>
<body>

    <div class="container">
        <!-- Left Column: Form -->
        <div class="form-section">
            <h1>Let’s Get to Know You!</h1>
            <p class="tagline">Tell us a little about yourself to help personalize your experience.</p>

            <form action="{{ url_for('basic_question') }}" method="post">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="age">Age:</label>
                <input type="number" id="age" name="age" required>

                <label>Gender:</label>
                <div class="radio-group">
                    <input type="radio" id="male" name="gender" value="Male" required>
                    <label for="male">Male</label>

                    <input type="radio" id="female" name="gender" value="Female">
                    <label for="female">Female</label>

                    <input type="radio" id="other" name="gender" value="Other">
                    <label for="other">Other</label>
                </div>

                <label for="occupation">Occupation:</label>
                <select id="occupation" name="occupation" required>
                    <option value="">Select...</option>
                    <option value="Student">Student</option>
                    <option value="Working Professional">Working Professional</option>
                    <option value="Self-employed">Self-employed</option>
                    <option value="Homemaker">Homemaker</option>
                    <option value="Retired">Retired</option>
                    <option value="Other">Other</option>
                </select>

                <label>Do you have any existing medical conditions?</label>
                <div class="radio-group">
                    <input type="radio" id="medical_yes" name="medical_condition" value="Yes" required onclick="toggleMedicalCondition()">
                    <label for="medical_yes">Yes</label>

                    <input type="radio" id="medical_no" name="medical_condition" value="No" onclick="toggleMedicalCondition()">
                    <label for="medical_no">No</label>
                </div>

                <div id="medical_condition_input" style="display: none;">
                    <label for="medical_details">Please specify:</label>
                    <input type="text" id="medical_details" name="medical_details" placeholder="Enter medical conditions...">
                </div>

                <button type="submit">Next</button>
            </form>
        </div>

        <!-- Right Column: Image -->
        <div class="image-section">
            <img src="{{ url_for('static', filename='basic_img.jpg') }}" alt="User Form Illustration">
        </div>
    </div>

</body>
</html>
